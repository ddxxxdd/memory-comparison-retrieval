[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-comparison-retrieval"
version = "0.1.0"
description = "Frozen-memory retrieval with existing-description selection"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "python-dotenv>=1.0,<2"]

[project.scripts]
memory-retrieval = "memory_retrieval.cli:main"

[tool.setuptools.packages.find]
include = ["memory_retrieval*"]
